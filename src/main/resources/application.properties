spring.application.name=Sang Connect
server.address=127.0.0.1
server.port=${BIZ04_PORT:8081}
spring.datasource.url=${BIZ04_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BIZ04;encrypt=true;trustServerCertificate=true;loginTimeout=10;}
spring.datasource.username=${BIZ04_DB_USER:biz04_app}
spring.datasource.password=${BIZ04_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
server.error.include-message=never
server.error.include-stacktrace=never
biz.upload-dir=${BIZ04_UPLOAD_DIR:./du-lieu/tep}
biz.demo=${BIZ04_DEMO:false}
biz.demo-password=${BIZ04_DEMO_PASSWORD:}
biz.fee-rate=0.10
biz.scheduler.enabled=true
biz.scheduler.delay-ms=60000
biz.smtp.host=${BIZ04_SMTP_HOST:}
biz.smtp.port=${BIZ04_SMTP_PORT:587}
biz.smtp.username=${BIZ04_SMTP_USERNAME:}
biz.smtp.password=${BIZ04_SMTP_PASSWORD:}
biz.smtp.from=${BIZ04_SMTP_FROM:}
biz.otp.hmac-key=${BIZ04_OTP_HMAC_KEY:}
biz.cccd.key=${BIZ04_CCCD_KEY:}
biz.otp.cooldown-seconds=${BIZ04_OTP_COOLDOWN_SECONDS:60}
biz.otp.send-account-hour=${BIZ04_OTP_SEND_ACCOUNT_HOUR:5}
biz.otp.send-ip-hour=${BIZ04_OTP_SEND_IP_HOUR:20}
biz.otp.try-account-hour=${BIZ04_OTP_TRY_ACCOUNT_HOUR:20}
biz.otp.try-ip-hour=${BIZ04_OTP_TRY_IP_HOUR:100}


# Contract intermediary declared by the project owner; no legal entity is inferred.
biz.contract.operator-name=${BIZ04_CONTRACT_OPERATOR_NAME:Mai Ph\u01b0\u1edbc Sang}
biz.contract.operator-phone=${BIZ04_CONTRACT_OPERATOR_PHONE:}
biz.contract.operator-representative=${BIZ04_CONTRACT_OPERATOR_REPRESENTATIVE:Mai Ph\u01b0\u1edbc Sang}
