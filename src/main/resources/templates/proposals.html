<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><div th:fragment="list(rows, received)" class="proposal-area">
<article class="proposal" th:each="row:${rows}" th:with="planLink=${row.rawStatus == 'DA_CHON' and row.contractId == null ? @milestoneLinks.link(me.id,'de-xuat',row.id) : null}">
<div class="row-item"><div><h3><a th:href="@{/chuyen-gia/{id}(id=${row.expertId})}" th:text="${row.expertName}"></a></h3><a th:href="@{/yeu-cau/{id}(id=${row.requestId})}" th:text="${row.requestTitle}"></a></div><strong th:text="${@fmt.money(row.price)}"></strong></div>
<p class="pre" th:text="${row.plan}"></p>
<p class="hint"><span th:if="${row.days != null}" th:text="${'Thời gian thực hiện: '+row.days+' ngày · '}"></span><span th:text="${'Thời điểm gửi: '+@fmt.date(row.submitted)}"></span></p>
<span class="proposal-state" th:classappend="${'proposal-state--'+(planLink != null and planLink.state == 'DA_HUY' ? 'rejected' : row.tone)}" th:text="${planLink != null ? planLink.label : row.label}"></span>
<p th:if="${row.contractId != null}"><a th:href="@{/hop-dong/{id}(id=${row.contractId})}">Mở hợp đồng</a><span th:text="${' · Hợp đồng: '+@fmt.status(row.contractStatus)}"></span></p>
<div class="actions proposal-actions"><a th:href="@{/de-xuat/{id}(id=${row.id})}">Xem chi tiết đề xuất</a><a class="btn proposal-reject" th:if="${row.canDecide}" th:href="@{/de-xuat/{id}/xac-nhan(id=${row.id},hanhDong='tu-choi')}">Từ chối</a><a class="btn" th:if="${row.canDecide}" th:href="@{/de-xuat/{id}/xac-nhan(id=${row.id},hanhDong='chap-thuan')}">Chấp thuận</a><th:block th:if="${row.rawStatus == 'DA_CHON' and row.contractId == null}" th:with="link=${planLink}"><a th:if="${link != null}" th:href="${link.url}" th:text="${link.text}"></a></th:block><form th:if="${row.canWithdraw}" th:action="@{/de-xuat/{id}/rut(id=${row.id})}" method="post"><button class="link">Rút đề xuất</button></form></div>
</article>
<p class="empty" th:if="${rows.isEmpty()}" th:text="${received ? 'Yêu cầu này chưa nhận được đề xuất.' : 'Chưa có đề xuất đã gửi.'}"></p>
</div>
<div th:fragment="table(rows, received)" class="proposal-area"><p class="hint proposal-scroll-note">Cuộn ngang để xem đầy đủ đề xuất.</p><div class="table-wrap" tabindex="0" aria-label="Danh sách đề xuất, có thể cuộn ngang"><table><thead><tr><th>Yêu cầu</th><th th:if="${received}">Chuyên gia</th><th>Giá đề xuất</th><th>Thời điểm gửi</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="row:${rows}" th:with="planLink=${row.rawStatus == 'DA_CHON' and row.contractId == null ? @milestoneLinks.link(me.id,'de-xuat',row.id) : null}"><td><a th:href="@{/yeu-cau/{id}(id=${row.requestId})}" th:text="${row.requestTitle}"></a></td><td th:if="${received}"><a th:href="@{/chuyen-gia/{id}(id=${row.expertId})}" th:text="${row.expertName}"></a></td><td class="proposal-price" th:text="${@fmt.money(row.price)}"></td><td class="proposal-date" th:text="${@fmt.date(row.submitted)}"></td><td><span class="proposal-state" th:classappend="${'proposal-state--'+(planLink != null and planLink.state == 'DA_HUY' ? 'rejected' : row.tone)}" th:text="${planLink != null ? planLink.label : row.label}"></span><p th:if="${row.contractId!=null}"><a th:href="@{/hop-dong/{id}(id=${row.contractId})}">Mở hợp đồng</a><span th:text="${' · '+@fmt.status(row.contractStatus)}"></span></p></td><td><a th:href="@{/de-xuat/{id}(id=${row.id})}">Xem đề xuất</a><p th:if="${row.rawStatus == 'DA_CHON' and row.contractId == null}" th:with="link=${planLink}"><a th:if="${link != null}" th:href="${link.url}" th:text="${link.text}"></a></p><form th:if="${row.canWithdraw}" th:action="@{/de-xuat/{id}/rut(id=${row.id})}" method="post"><button class="link">Rút đề xuất</button></form></td></tr></tbody></table></div><p class="empty" th:if="${rows.isEmpty()}" th:text="${received ? 'Yêu cầu này chưa nhận được đề xuất.' : 'Chưa có đề xuất đã gửi.'}"></p></div>
</html>
