<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="service-approval-page"><link rel="stylesheet" th:href="@{/css/service-approval.css}"><a th:href="@{/quan-tri}">← Quản trị</a><h1>Duyệt nội dung dịch vụ</h1><section class="panel narrow"><h2 th:text="${service.tenDichVu}"></h2><p>Chuyên gia: <span th:text="${names[service.maChuyenGia]}"></span> · Phiên bản <span th:text="${service.phienBanNoiDung}"></span></p><p th:text="${service.linhVuc}"></p><p class="pre" th:text="${service.moTa}"></p><strong th:text="${@fmt.money(service.giaThamKhao)}"></strong><p>Trạng thái duyệt: <span th:text="${@fmt.status(service.trangThaiDuyet)}"></span></p><p th:if="${service.canRaSoatLai}">Nội dung cũ chưa được người tiếp quản rà soát, chỉnh sửa và gửi lại.</p><form th:if="${service.trangThaiDuyet == 'CHO_DUYET'}" th:action="@{/quan-tri/dich-vu/{id}/duyet(id=${service.maDichVu})}" method="post"><input type="hidden" name="phienBan" th:value="${service.phienBanNoiDung}"><label>Lý do khi từ chối<textarea name="lyDo" maxlength="2000"></textarea></label><div class="actions"><button class="btn" name="chapThuan" value="true">Duyệt và công khai</button><button class="btn secondary" name="chapThuan" value="false">Từ chối nội dung</button></div></form></section></main></html>
