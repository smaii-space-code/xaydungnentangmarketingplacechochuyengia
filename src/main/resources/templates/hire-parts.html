<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="fields(form)" th:object="${form}"><label>Phạm vi công việc<textarea th:field="*{scope}" required minlength="10" maxlength="10000" rows="5"></textarea></label><label>Sản phẩm mong muốn<textarea th:field="*{deliverable}" required minlength="5" maxlength="5000" rows="3"></textarea></label><div class="hire-input-grid"><label>Giá đề nghị (VND)<input th:field="*{price}" type="number" required min="1" max="1000000000000" step="1" inputmode="numeric"></label><label>Thời gian thực hiện (ngày)<input th:field="*{days}" type="number" required min="1" max="730" step="1" inputmode="numeric"></label></div></div>
<dl class="hire-terms" th:fragment="terms(t)"><div><dt>Giá đề nghị</dt><dd th:text="${@fmt.money(t.price)}"></dd></div><div><dt>Thời gian dự kiến</dt><dd th:text="${t.days+' ngày'}"></dd></div><div><dt>Phạm vi công việc</dt><dd class="pre" th:text="${t.scope}"></dd></div><div><dt>Sản phẩm mong muốn</dt><dd class="pre" th:text="${t.deliverable}"></dd></div></dl>
<span th:fragment="state(r)" class="hire-state" th:classappend="${'hire-state--'+r.tone}" th:text="${r.label}"></span>
<nav class="hire-pagination" th:fragment="pages(p)" th:if="${p.total > 0}" aria-label="Phân trang"><span th:text="${'Trang '+p.number+' / '+p.pages+' · '+p.total+' bản ghi'}"></span><div class="actions"><a th:if="${p.previous != null}" th:href="${p.previous}">← Trước</a><a th:if="${p.next != null}" th:href="${p.next}">Sau →</a></div></nav>
</body></html>
