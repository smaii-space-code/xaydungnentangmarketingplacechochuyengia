<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main>
<p class="context-label" th:text="${'TC-'+dispute.maTranhChap+' · HĐ-'+contract.maHopDong}"></p><div class="page-head"><div><h1>Hồ sơ tranh chấp</h1><span class="badge" th:text="${@fmt.status(dispute.trangThai)}"></span></div><a class="btn secondary" th:href="@{/hop-dong/{id}(id=${contract.maHopDong})}">Về hợp đồng</a></div><section class="panel"><h2 th:text="${milestone.tenMoc}"></h2><p class="pre" th:text="${dispute.lyDo}"></p><p th:text="${'Ký quỹ còn giữ: '+@fmt.money(balance.dangGiu)}"></p><p class="hint" th:text="${'Hạn nộp bằng chứng: '+@fmt.date(dispute.hanNopBangChung)}"></p><p>Không tự giải ngân hay hoàn tiền khi hai bên còn bất đồng.</p></section><section class="panel"><h2>Bằng chứng &amp; phản hồi</h2><article class="review" th:each="b:${evidence}"><strong th:text="${names[b.maNguoiGui]+' · '+@fmt.status(b.loaiNoiDung)}"></strong><p class="pre" th:text="${b.noiDung}"></p><a th:if="${b.duongDanTep!=null}" th:href="@{/tep/bang-chung/{id}(id=${b.maBangChung})}">Tải tệp bằng chứng</a><p class="hint" th:text="${@fmt.date(b.ngayGui)}"></p></article><form th:if="${isParty and dispute.ngayDong==null and dispute.ngayKetLuan==null}" th:action="@{/tranh-chap/{id}/bang-chung(id=${dispute.maTranhChap})}" method="post" enctype="multipart/form-data"><label>Nội dung bằng chứng<textarea name="noiDung" required minlength="5" maxlength="10000"></textarea></label><label>Tệp đính kèm<input name="tep" type="file" accept=".pdf,.zip,.png,.jpg,.jpeg,.webp,.txt,.docx,.xlsx,.pptx"></label><button class="btn">Gửi bằng chứng</button></form></section><section class="panel" th:if="${dispute.ngayKetLuan!=null}"><h2>Kết luận</h2><p class="pre" th:text="${dispute.ketLuan}"></p><p th:text="${'Chuyên gia trước phí: '+@fmt.money(dispute.tienGiaiNgan)+' · Hoàn khách: '+@fmt.money(dispute.tienHoanTra)}"></p><p th:text="${'Hướng hợp đồng: '+@fmt.status(dispute.huongXuLyHopDong)}"></p><p th:text="${'Thời điểm đóng: '+@fmt.date(dispute.ngayDong)}"></p></section>
<section class="panel" th:if="${me.admin and dispute.ngayDong==null}"><h2>Xử lý của quản trị viên</h2><details th:if="${dispute.ngayKetLuan==null}"><summary>Yêu cầu bổ sung bằng chứng</summary><form th:action="@{/tranh-chap/{id}/bo-sung(id=${dispute.maTranhChap})}" method="post"><label>Nội dung cần làm rõ<textarea name="noiDung" required minlength="5"></textarea></label><button class="btn secondary">Gửi yêu cầu, mở hạn bổ sung</button></form></details><form th:action="@{/tranh-chap/{id}/ket-luan(id=${dispute.maTranhChap})}" method="post"><div th:if="${dispute.ngayKetLuan==null}"><label>Kết luận và căn cứ<textarea name="ketLuan" required minlength="10" maxlength="10000"></textarea></label><label>Phân bổ trước phí cho chuyên gia (đồng)<input name="tienChuyenGia" type="number" min="0" step="1" value="0" required></label><label class="check"><input name="tiepTuc" type="checkbox" value="true">Đề xuất tiếp tục hợp đồng sau khi hai bên xác nhận lại</label></div><p th:if="${dispute.ngayKetLuan!=null}">Giữ nguyên kết luận đã ghi; chỉ thử lại những phần giao dịch chưa thành công.</p><label>Kết quả thanh toán mô phỏng<select name="ketQua"><option value="SUCCESS">Thành công</option><option value="FAIL">Thất bại</option><option value="FAIL_REFUND">Giải ngân thành công, hoàn tiền thất bại</option></select></label><button class="btn" th:text="${dispute.ngayKetLuan==null?'Ghi kết luận &amp; thực thi':'Thử thực thi lại'}"></button></form></section>
</main></html>
