<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="hire-area"><link rel="stylesheet" th:href="@{/css/hire.css}"><h1>Từ chối đề nghị thuê</h1><p th:text="${offer.row.title}"></p><p>Thao tác này kết thúc thương lượng. Lịch sử đề nghị được giữ lại.</p><form class="hire-form panel" th:action="@{/de-nghi-thue/{id}/tu-choi/ra-soat(id=${offer.row.id})}" method="post"><input type="hidden" name="phienBan" th:value="${offer.row.current}"><div class="notice danger" th:if="${formError}" th:text="${formError}" role="alert"></div><label>Lý do từ chối<textarea name="reason" th:text="${reason}" required minlength="5" maxlength="2000" rows="4"></textarea></label><div class="actions"><button class="btn">Rà soát trước khi từ chối</button><a th:href="@{/de-nghi-thue/{id}(id=${offer.row.id})}">Hủy</a></div></form></main></html>
