<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="hire-area"><link rel="stylesheet" th:href="@{/css/hire.css}">
<h1>Rà soát đề nghị thuê</h1><p>Đề nghị chưa được gửi. Hãy kiểm tra nội dung trước khi xác nhận.</p>
<div class="notice danger" th:if="${formError}" th:text="${formError}" role="alert"></div>
<section class="panel"><h2 th:text="${title}"></h2><p>Gửi đến <strong th:text="${origin.expertName}"></strong></p><p th:if="${origin.source != null}">Dịch vụ nguồn: <strong th:text="${origin.sourceTitle}"></strong></p><dl th:replace="~{hire-parts :: terms(${terms})}"></dl></section>
<p class="hint">Thao tác gửi không tạo hợp đồng hoặc giao dịch tiền.</p>
<form th:action="@{/de-nghi-thue/gui/xac-nhan}" method="post"><input type="hidden" name="token" th:value="${token}"><div class="actions"><button class="btn" type="submit">Xác nhận gửi đề nghị thuê</button><a th:href="@{/de-nghi-thue/gui/sua(token=${token})}">Quay lại chỉnh sửa</a><a th:href="@{/chuyen-gia/{id}(id=${origin.expert})}">Hủy, trở về hồ sơ</a></div></form>
</main></html>
