<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="milestone-area"><link rel="stylesheet" th:href="@{/css/milestone-plan.css}"><a th:href="@{/bang-dieu-khien}">← Không gian làm việc</a><h1>Kế hoạch mốc trước hợp đồng</h1><p th:text="${workspace.total+' nguồn và kế hoạch mốc'}"></p><article class="mp-list-row" th:each="plan:${workspace.rows}"><div><h2 th:text="${plan.source.title}"></h2><p th:text="${plan.label}"></p><p class="hint" th:text="${plan.source.customerName+' · '+plan.source.expertName}"></p></div><a th:href="${plan.source.planUrl}" th:text="${plan.canEdit and plan.current == 0 ? 'Thiết lập mốc' : 'Mở kế hoạch'}"></a></article><p class="empty" th:if="${workspace.rows.isEmpty()}">Chưa có nguồn đủ điều kiện xác lập mốc hoặc kế hoạch đã gửi.</p><nav class="actions" th:if="${workspace.pages > 1}"><a th:if="${workspace.page > 1}" th:href="@{/ke-hoach-moc(trang=${workspace.page-1})}">Trang trước</a><span th:text="${workspace.page+' / '+workspace.pages}"></span><a th:if="${workspace.page < workspace.pages}" th:href="@{/ke-hoach-moc(trang=${workspace.page+1})}">Trang sau</a></nav></main></html>
