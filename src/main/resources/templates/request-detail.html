<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main><link rel="stylesheet" th:href="@{/css/proposals.css}">
<div class="page-head"><div><p class="context-label" th:text="${'YC-'+request.maYeuCau}"></p><h1 th:text="${request.tieuDe}"></h1><span class="badge" th:text="${@fmt.status(request.trangThai)}"></span></div><strong class="big-number" th:text="${@fmt.money(request.nganSach)}"></strong></div><section class="panel"><p class="pre" th:text="${request.moTa}"></p><p th:text="${'Khách hàng: '+publicProject.customer}"></p><p th:text="${'Hạn dự kiến: '+@fmt.date(request.hanDuKien)}"></p><p th:text="${'Lĩnh vực: '+(publicProject.field == null ? 'Chưa cung cấp' : publicProject.field)}"></p><p th:text="${'Ngày đăng: '+@fmt.date(publicProject.posted)}"></p><a th:if="${contract!=null}" class="btn" th:href="@{/hop-dong/{id}(id=${contract.maHopDong})}">Xem hợp đồng</a><form th:if="${request.maKhachHang==me.id and request.trangThai=='DANG_MO'}" th:action="@{/yeu-cau/{id}/dong(id=${request.maYeuCau})}" method="post"><button class="link">Đóng yêu cầu</button></form></section>
<section class="panel" th:if="${request.maKhachHang==me.id and request.trangThai=='DANG_MO'}"><details><summary>Chỉnh sửa yêu cầu trước khi lập hợp đồng</summary><form th:action="@{/yeu-cau/{id}/sua(id=${request.maYeuCau})}" method="post"><label>Tiêu đề<input name="tieuDe" required minlength="5" maxlength="255" th:value="${request.tieuDe}"></label><label>Nội dung<textarea name="moTa" required minlength="10" maxlength="10000" th:text="${request.moTa}"></textarea></label><label>Ngân sách<input name="nganSach" type="number" min="1" step="1" required th:value="${request.nganSach}"></label><label>Hạn dự kiến<input name="han" type="date" th:value="${request.hanDuKien==null?'':#temporals.format(request.hanDuKien,'yyyy-MM-dd')}"></label><button class="btn">Lưu yêu cầu</button></form></details></section><section class="panel" id="de-xuat-nhan"><h2 th:text="${owner?'Các đề xuất nhận được':'Đề xuất của bạn'}"></h2><p th:text="${'Tổng '+proposals.size()+' đề xuất, gồm cả đề xuất đã xử lý.'}"></p><div th:replace="~{proposals :: list(${proposals},${owner})}"></div></section>
<section class="panel narrow" th:if="${canPropose}"><h2>Gửi hoặc cập nhật đề xuất</h2><form th:action="@{/yeu-cau/{id}/de-xuat(id=${request.maYeuCau})}" method="post"><label>Phương án thực hiện<textarea name="phuongAn" required minlength="10" maxlength="10000"></textarea></label><label>Giá đề xuất (đồng)<input name="gia" type="number" min="1" step="1" required></label><label>Số ngày thực hiện dự kiến<input name="soNgay" type="number" min="1" max="730" required></label><button class="btn">Gửi đề xuất</button></form></section>
</main></html>
