<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="econtract-area"><link rel="stylesheet" th:href="@{/css/electronic-contract.css}"><h1>Hủy hợp đồng điện tử trước hiệu lực</h1><p>Chỉ áp dụng cho hợp đồng chưa có hiệu lực. Quyết định và lịch sử được giữ lại.</p><p class="notice danger" role="alert" th:if="${formError}" th:text="${formError}"></p><form th:action="@{/hop-dong/{id}/huy-dien-tu/ra-soat(id=${contractId})}" method="post"><input type="hidden" name="token" th:value="${token}"><label>Lý do · 5–2.000 ký tự<textarea name="reason" th:text="${cancelForm.reason}" minlength="5" maxlength="2000" required rows="4"></textarea></label><div class="actions"><button type="submit" class="btn">Rà soát hủy hợp đồng</button><a th:href="@{/hop-dong/{id}(id=${contractId})}">Tiếp tục xem hợp đồng</a></div></form></main></html>
