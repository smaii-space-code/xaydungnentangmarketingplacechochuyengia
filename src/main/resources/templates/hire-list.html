<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="hire-area"><link rel="stylesheet" th:href="@{/css/hire.css}"><a th:href="@{/bang-dieu-khien}">← Không gian làm việc</a><h1 th:text="${side == 'da-gui' ? 'Đề nghị thuê đã gửi' : (side == 'nhan' ? 'Đề nghị thuê nhận được' : 'Tra cứu đề nghị thuê')}"></h1><p>Đề nghị thuê được theo dõi riêng với đề xuất trong luồng tìm dự án.</p><section class="panel"><div class="table-wrap" tabindex="0" aria-label="Danh sách đề nghị thuê"><table class="hire-table"><thead><tr><th>Tiêu đề / Đối tác</th><th>Giá / Thời gian</th><th>Gửi / Cập nhật</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="r:${page.items}"><td><strong th:text="${r.title}"></strong><p th:text="${side == 'da-gui' ? r.expertName : (side == 'nhan' ? r.customerName : r.customerName+' → '+r.expertName)}"></p></td><td><strong th:text="${@fmt.money(r.price)}"></strong><p th:text="${r.days+' ngày'}"></p></td><td><span th:text="${@fmt.offsetDate(r.sent)}"></span><p th:text="${@fmt.offsetDate(r.updated)}"></p></td><td><span th:replace="~{hire-parts :: state(${r})}"></span><p th:text="${'Phiên bản '+r.current}"></p></td><td><a th:href="@{/de-nghi-thue/{id}(id=${r.id})}">Xem chi tiết</a></td></tr></tbody></table></div><p class="empty" th:if="${page.items.isEmpty()}">Chưa có đề nghị thuê.</p><nav th:replace="~{hire-parts :: pages(${page})}"></nav></section></main></html>
