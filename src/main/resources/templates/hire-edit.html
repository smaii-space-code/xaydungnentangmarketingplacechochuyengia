<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="hire-area"><link rel="stylesheet" th:href="@{/css/hire.css}"><h1>Đề nghị điều chỉnh</h1><p th:text="${offer.row.title}"></p><p th:text="${'Điều chỉnh từ phiên bản '+offer.row.current+'. Bản cũ được giữ nguyên để đối chiếu.'}"></p><form class="hire-form panel" th:action="@{/de-nghi-thue/{id}/dieu-chinh/ra-soat(id=${offer.row.id})}" th:object="${form}" method="post"><input type="hidden" name="phienBan" th:value="${offer.row.current}"><div class="notice danger" th:if="${formError}" th:text="${formError}" role="alert"></div><div th:replace="~{hire-parts :: fields(${form})}"></div><label>Giải thích nội dung muốn điều chỉnh<textarea th:field="*{reason}" required minlength="5" maxlength="2000" rows="3"></textarea></label><div class="actions"><button class="btn">Rà soát thay đổi</button><a th:href="@{/de-nghi-thue/{id}(id=${offer.row.id})}">Hủy</a></div></form></main></html>
