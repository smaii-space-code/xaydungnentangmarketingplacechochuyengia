<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="hire-area"><link rel="stylesheet" th:href="@{/css/hire.css}">
<a th:href="@{/chuyen-gia/{id}(id=${origin.expert})}">← Hồ sơ chuyên gia</a><h1>Gửi đề nghị thuê</h1><p>Gửi đến <strong th:text="${origin.expertName}"></strong>. Hai bên có thể trao đổi các phiên bản trước khi thống nhất nội dung.</p><p th:if="${origin.source != null}">Dịch vụ nguồn: <strong th:text="${origin.sourceTitle}"></strong></p>
<form class="hire-form panel" th:action="@{/de-nghi-thue/gui}" th:object="${form}" method="post"><input type="hidden" name="token" th:value="${token}"><div class="notice danger" th:if="${formError}" th:text="${formError}" role="alert"></div><label>Tiêu đề công việc<input th:field="*{title}" required minlength="5" maxlength="255"></label><div th:replace="~{hire-parts :: fields(${form})}"></div><p class="hint">Rà soát giá, phạm vi và sản phẩm trước khi gửi. Nội dung này chưa phải hợp đồng đã ký; thao tác gửi không tạo hợp đồng hoặc giao dịch tiền.</p><div class="actions"><button class="btn" type="submit">Gửi đề nghị thuê</button><a th:href="@{/chuyen-gia/{id}(id=${origin.expert})}">Hủy</a></div></form>
</main></html>
