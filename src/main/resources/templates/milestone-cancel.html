<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="milestone-area"><link rel="stylesheet" th:href="@{/css/milestone-plan.css}"><h1>Hủy thương lượng mốc</h1><p th:text="${plan.source.title}"></p><p>Chỉ kết thúc thương lượng mốc của nguồn này. Lịch sử được giữ, không tự đóng yêu cầu hoặc hủy giao dịch khác.</p><div class="notice danger" role="alert" th:if="${formError}" th:text="${formError}"></div><form class="mp-cancel" th:action="${plan.source.planUrl+'/huy/ra-soat'}" method="post"><input type="hidden" name="token" th:value="${token}"><label>Lý do hủy · 5–2.000 ký tự<textarea name="reason" th:text="${cancelForm.reason}" minlength="5" maxlength="2000" rows="4" required></textarea></label><div class="actions"><button class="btn" type="submit">Rà soát việc hủy</button><a th:href="${plan.source.planUrl}">Tiếp tục thương lượng</a></div></form></main></html>
