<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main><link rel="stylesheet" th:href="@{/css/service-approval.css}">
<div class="page-head"><div><p class="context-label">QUẢN TRỊ NỀN TẢNG</p><h1>Quản trị &amp; xử lý hồ sơ</h1></div></div><section class="panel"><h2>Hồ sơ chuyên gia</h2><p><a class="btn" th:href="@{/quan-tri/chuyen-gia}">Xét duyệt chuyên gia</a></p></section><section class="panel"><h2>Tranh chấp</h2><div class="table-wrap"><table><thead><tr><th>Hồ sơ</th><th>Mốc</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="t:${disputes}"><td th:text="${'TC-'+t.maTranhChap}"></td><td th:text="${t.maMocNghiemThu}"></td><td th:text="${@fmt.status(t.trangThai)}"></td><td><a th:href="@{/tranh-chap/{id}(id=${t.maTranhChap})}">Mở hồ sơ →</a></td></tr></tbody></table></div></section><section class="panel"><h2>Tài khoản</h2><div class="table-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.hoTen}"></td><td th:text="${u.email}"></td><td th:text="${@fmt.status(u.trangThai)}"></td><td><form th:if="${!u.admin and (u.trangThai == 'HOAT_DONG' or u.trangThai == 'KHOA')}" th:action="@{/quan-tri/tai-khoan/{id}(id=${u.id})}" method="post"><input name="khoa" type="hidden" th:value="${u.trangThai=='HOAT_DONG'}"><button class="link" th:text="${u.trangThai=='HOAT_DONG'?'Khóa':'Mở khóa'}"></button></form></td></tr></tbody></table></div></section><section class="panel"><h2>Nội dung dịch vụ</h2><article class="row-item service-approval-row" th:each="d:${services}"><div><strong th:text="${d.tenDichVu}"></strong><p th:text="${@fmt.status(d.trangThai)}"></p></div><div class="actions"><span th:text="${@fmt.status(d.trangThaiDuyet)}"></span><a th:href="@{/quan-tri/dich-vu/{id}/duyet(id=${d.maDichVu})}">Xem / duyệt nội dung</a><form th:if="${d.trangThai == 'DANG_HIEN' or d.trangThaiDuyet == 'DA_DUYET'}" th:action="@{/dich-vu/{id}/hien-thi(id=${d.maDichVu})}" method="post"><input name="hien" type="hidden" th:value="${d.trangThai!='DANG_HIEN'}"><button class="link" th:text="${d.trangThai=='DANG_HIEN'?'Ẩn dịch vụ':'Hiện dịch vụ đã duyệt'}"></button></form></div></article></section><section class="panel"><h2>Kiểm duyệt đánh giá</h2><article class="review" th:each="d:${reviews}"><strong th:text="${'ĐG-'+d.maDanhGia+' · '+@fmt.status(d.trangThai)}"></strong><p class="pre" th:text="${d.noiDung}"></p><form class="inline-form" th:if="${d.trangThai!='BI_AN_VI_PHAM'}" th:action="@{/quan-tri/danh-gia/{id}(id=${d.maDanhGia})}" method="post"><label>Lý do vi phạm<input name="lyDo" required minlength="5" maxlength="2000"></label><button class="btn secondary">Ẩn do vi phạm</button></form></article></section><section class="panel"><h2>Nhật ký gần nhất</h2><div class="table-wrap"><table><thead><tr><th>Thời điểm</th><th>Người thực hiện</th><th>Đối tượng</th><th>Hành động</th></tr></thead><tbody><tr th:each="n:${logs}"><td th:text="${@fmt.date(n.thoiDiem)}"></td><td th:text="${n.maNguoiThucHien==null?'Hệ thống':names[n.maNguoiThucHien]}"></td><td th:text="${n.loaiDoiTuong+' #'+n.maDoiTuong}"></td><td th:text="${n.hanhDong}"></td></tr></tbody></table></div></section>
</main></html>
