<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main><link rel="stylesheet" th:href="@{/css/expert-admission.css}">
<section class="panel expert-admission"><div class="notice success" th:if="${success}" th:text="${success}" role="status"></div><div class="notice danger" th:if="${error}" th:text="${error}" role="alert"></div><p><a th:href="@{/quan-tri/chuyen-gia}">← Danh sách xét duyệt</a></p><h1>Hồ sơ chuyên gia</h1><p th:text="${'Trạng thái: ' + detail.application.state + ' · Phiên bản ' + detail.application.version}"></p><div th:if="${detail.current != null}"><h2 th:text="${detail.current.name}"></h2><p th:text="${detail.current.email}"></p><p th:text="${detail.current.phone}"></p><h3 th:text="${detail.current.field}"></h3><p class="pre" th:text="${detail.current.bio}"></p><p th:text="${'Gửi lúc ' + @fmt.offsetDate(detail.current.submitted)}"></p><form th:if="${detail.application.state == 'CHO_DUYET'}" th:action="@{/quan-tri/chuyen-gia/{id}/duyet(id=${detail.application.userId})}" method="post"><input name="phienBan" type="hidden" th:value="${detail.application.version}"><label>Lý do từ chối (bắt buộc khi từ chối)<textarea name="lyDo" maxlength="2000" rows="4"></textarea></label><div class="actions"><button class="btn" name="action" value="DUYET">Duyệt</button><button class="btn secondary" name="action" value="TU_CHOI">Từ chối</button></div></form></div><h2>Lịch sử quyết định</h2><p th:if="${detail.decisions.empty}">Chưa có quyết định.</p><article th:each="q:${detail.decisions}"><h3 th:text="${'Phiên bản ' + q.version + (q.accepted ? ' — Đã duyệt' : ' — Từ chối')}"></h3><p th:text="${'Admin #' + q.admin + ' · ' + @fmt.offsetDate(q.decided)}"></p><p class="pre" th:if="${q.reason != null}" th:text="${q.reason}"></p></article><details th:each="v:${detail.versions}"><summary th:text="${'Hồ sơ phiên bản ' + v.version}"></summary><p th:text="${v.name + ' · ' + v.field}"></p><p class="pre" th:text="${v.bio}"></p></details></section>
</main></html>
