<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}"><main class="discovery-page expert-profile">
<link rel="stylesheet" th:href="@{/css/discovery.css}">
<a class="discovery-back" th:href="@{/trang/trangchu#chuyen-gia}">← Tất cả chuyên gia</a>
<section class="discovery-profile" th:with="e=${profile.expert}"><div class="person-heading"><span class="person-avatar person-avatar-large" role="img" th:aria-label="${'Ảnh đại diện chữ của '+e.name}" th:text="${e.initials}"></span><div><h1 th:text="${e.name}"></h1><p class="person-fields" th:if="${!e.fields.isEmpty()}" th:text="${#strings.listJoin(e.fields, ' · ')}"></p></div></div>
  <p class="discovery-full-text" th:if="${e.introduction != null and !#strings.isEmpty(e.introduction)}" th:text="${e.introduction}"></p><p class="discovery-muted" th:if="${e.introduction == null or #strings.isEmpty(e.introduction)}">Chuyên gia chưa bổ sung giới thiệu.</p>
  <div class="person-proof"><a href="#danh-gia" th:if="${e.reviewCount > 0}" th:text="${#numbers.formatDecimal(e.average,1,1)+' / 5 · '+e.reviewCount+' đánh giá'}"></a><span th:if="${e.reviewCount == 0}">Chưa có đánh giá</span><span th:if="${e.completed > 0}" th:text="${e.completed+' công việc hoàn thành'}"></span></div>
  <p th:if="${canHireExpert}"><a class="discovery-button" th:href="@{/de-nghi-thue/gui/chuyen-gia/{id}(id=${profile.expert.id})}">Gửi đề nghị thuê</a></p>
</section>
<section id="dich-vu" class="discovery-section" aria-labelledby="expert-services-title"><div class="discovery-section-heading"><h2 id="expert-services-title">Dịch vụ của chuyên gia</h2><span th:text="${profile.services.total+' dịch vụ'}"></span></div>
  <div class="discovery-grid"><th:block th:each="d:${profile.services.items}"><article th:replace="~{discovery-cards :: service(${d})}"></article></th:block></div>
  <p class="discovery-empty" th:if="${profile.services.items.isEmpty()}">Chuyên gia này chưa có dịch vụ công khai.</p><nav th:replace="~{discovery-cards :: pagination(${profile.services},'dịch vụ')}"></nav>
</section>
<section id="danh-gia" class="discovery-section" aria-labelledby="expert-reviews-title"><h2 id="expert-reviews-title">Đánh giá đã công khai</h2><article class="discovery-review" th:each="r:${profile.reviews.items}"><div><strong th:text="${r.author}"></strong><span th:text="${r.score+' / 5'}"></span></div><p class="discovery-full-text" th:text="${r.text}"></p></article><p class="discovery-empty" th:if="${profile.reviews.items.isEmpty()}">Chưa có đánh giá</p><nav th:replace="~{discovery-cards :: pagination(${profile.reviews},'đánh giá')}"></nav></section>
</main></html>
